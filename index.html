
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Contributions</title>
    <!-- Tailwind CSS untuk Desain Hijau-Biru Modern -->
    <script src="https://tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0284c7', // Slate Blue
                        secondary: '#10b981', // Emerald Green
                    }
                }
            }
        }
       
        const SHEETY_API_URL =https://api.sheety.co/1d8958558aaca0269186290453b64a04/mixingRiwaRiwi/sheet1 ; 
    </script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen font-sans flex flex-col items-center justify-center p-4">

    <!-- 1. HALAMAN LOGIN (MASUK PAKAI NAMA) -->
    <div id="loginScreen" class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8 border border-slate-100 text-center">
        <div class="inline-flex p-3 bg-gradient-to-tr from-secondary to-primary rounded-2xl text-white mb-6 shadow-md">
            <svg xmlns="http://w3.org" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-8 h-8">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12c0 1.268-.63 2.39-1.593 3.068a3.745 3.745 0 01-1.043 3.296 3.745 3.745 0 01-3.296 1.043A3.745 3.745 0 0112 21c-1.268 0-2.39-.63-3.068-1.593a3.746 3.746 0 01-3.296-1.043 3.745 3.745 0 01-1.043-3.296A3.745 3.745 0 013 12c0-1.268.63-2.39 1.593-3.068a3.745 3.745 0 011.043-3.296 3.746 3.746 0 013.296-1.043A3.746 3.746 0 0112 3c1.268 0 2.39.63 3.068 1.593a3.746 3.746 0 013.296 1.043 3.746 3.746 0 011.043 3.296A3.745 3.745 0 0121 12z" />
            </svg>
        </div>
        <h2 class="text-2xl font-bold text-slate-900 mb-1">Team Contributions</h2>
        <p class="text-sm text-slate-500 mb-6">Masukkan nama Anda untuk melanjutkan</p>
        
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="mb-4 text-left">
                <label class="block text-xs font-semibold text-slate-600 mb-2 uppercase tracking-wider">Nama Lengkap</label>
                <input type="text" id="loginName" required placeholder="Contoh: Budi Santoso" class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all">
            </div>
            <button type="submit" class="w-full bg-gradient-to-r from-primary to-secondary hover:opacity-90 text-white font-medium py-3 rounded-xl shadow-md shadow-primary/20 transition-all flex items-center justify-center gap-2">
                Masuk ke Dashboard 
                <svg xmlns="http://w3.org" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4"><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" /></svg>
            </button>
        </form>
    </div>

    <!-- 2. HALAMAN DASHBOARD (AKAN MUNCUL SETELAH LOGIN) -->
    <div id="dashboardScreen" class="w-full max-w-4xl bg-white rounded-2xl shadow-xl border border-slate-100 hidden p-6 md:p-8">
        <!-- Header Dashboard -->
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b border-slate-100 pb-6 mb-6 gap-4">
            <div>
                <h1 class="text-2xl font-bold text-slate-900">Dashboard Iuran Tim</h1>
                <p class="text-sm text-slate-500">Halo, <span id="currentUser" class="font-semibold text-primary"></span> 👋</p>
            </div>
            <button onclick="handleLogout()" class="px-4 py-2 border border-rose-200 text-rose-600 rounded-xl text-sm font-medium hover:bg-rose-50 transition-all">Keluar</button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <!-- Form Input Data -->
            <div class="md:col-span-1 bg-slate-50 p-5 rounded-2xl border border-slate-100">
                <h3 class="text-lg font-bold mb-4 text-slate-900">Tambah Iuran</h3>
                <form id="iuranForm" onsubmit="handleSubmitData(event)">
                    <div class="mb-4">
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Nama Anggota</label>
                        <input type="text" id="formNama" readonly class="w-full px-3 py-2 bg-slate-200 border border-slate-300 rounded-xl font-medium text-slate-600 cursor-not-allowed">
                    </div>
                    <div class="mb-4">
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Bulan</label>
                        <select id="formBulan" required class="w-full px-3 py-2 border border-slate-200 rounded-xl bg-white focus:ring-2 focus:ring-primary focus:outline-none">
                            <option value="Januari">Januari</option>
                            <option value="Februari">Februari</option>
                            <option value="Maret">Maret</option>
                            <option value="April">April</option>
                            <option value="Mei">Mei</option>
                            <option value="Juni">Juni</option>
                            <option value="Juli">Juli</option>
                            <option value="Agustus">Agustus</option>
                            <option value="September">September</option>
                            <option value="Oktober">Oktober</option>
                            <option value="November">November</option>
                            <option value="Desember">Desember</option>
                        </select>
                    </div>
                    <div class="mb-5">
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Nominal (Rp)</label>
                        <input type="number" id="formNominal" required placeholder="Contoh: 50000" class="w-full px-3 py-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-primary focus:outline-none">
                    </div>
                    <button type="submit" id="btnSubmit" class="w-full bg-secondary text-white font-medium py-2.5 rounded-xl shadow-md hover:opacity-90 transition-all">Kirim Laporan</button>
                </form>
            </div>

            <!-- Tabel Riwayat Data -->
            <div class="md:col-span-2">
                <h3 class="text-lg font-bold mb-4 text-slate-900">Riwayat Pembayaran</h3>
                <div class="overflow-x-auto border border-slate-100 rounded-2xl shadow-inner max-h-[350px] overflow-y-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-50 border-b border-slate-100 text-xs font-bold text-slate-500 uppercase tracking-wider">
                                <th class="px-4 py-3">No</th>
                                <th class="px-4 py-3">Bulan</th>
                                <th class="px-4 py-3">Nama</th>
                                <th class="px-4 py-3">Nominal</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody" class="text-sm divide-y divide-slate-100">
                            <!-- Data Sheety dimasukkan di sini via JS -->
                            <tr>
                                <td colspan="4" class="text-center py-8 text-slate-400">Memuat data dari Google Sheets...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // Cek sesi login otomatis saat halaman dibuka
        document.addEventListener("DOMContentLoaded", () => {
            const savedUser = localStorage.getItem("teamUser");
            if (savedUser) {
                showDashboard(savedUser);
            }
        });

        function handleLogin(e) {
            e.preventDefault();
            const nameInput = document.getElementById("loginName").value.trim();
            if (nameInput) {
                localStorage.setItem("teamUser", nameInput);
                showDashboard(nameInput);
            }
        }

        function handleLogout() {
            localStorage.removeItem("teamUser");
            document.getElementById("dashboardScreen").classList.add("hidden");
            document.getElementById("loginScreen").classList.remove("hidden");
            document.getElementById("loginName").value = "";
        }

        function showDashboard(name) {
            document.getElementById("loginScreen").classList.add("hidden");
            document.getElementById("dashboardScreen").classList.remove("hidden");
            document.getElementById("currentUser").innerText = name;
            document.getElementById("formNama").value = name;
            fetchData();
        }

        // Ambil Data (GET) dari Sheety
        async function fetchData() {
            const tableBody = document.getElementById("tableBody");
            try {
                const response = await fetch(SHEETY_API_URL);
                const result = await response.json();
                
                // Sheety membungkus array data di dalam nama objek sheet (biasanya berformat camelCase/huruf kecil)
                const keyName = Object.keys(result)[0]; 
                const dataRows = result[keyName];

                tableBody.innerHTML = "";
                if (!dataRows || dataRows.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="4" class="text-center py-8 text-slate-400">Belum ada data pembayaran.</td></tr>`;
                    return;
                }

                dataRows.forEach((row) => {
