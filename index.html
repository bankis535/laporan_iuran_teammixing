
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Iuran TeamMixing</title>
    <!-- Tailwind CSS untuk desain modern ala v0 -->
    <script src="https://jsdelivr.net"></script>
    <!-- Lucide Icons untuk ikon premium -->
    <script src="https://unpkg.com"></script>
</head>
<body class="bg-slate-955 text-slate-100 min-h-screen font-sans antialiased selection:bg-blue-500/30">

    <div class="max-w-5xl mx-auto px-4 py-8">
        <!-- HEADER INTERAKTIF -->
        <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-8 pb-6 border-b border-slate-800/80 gap-4">
            <div>
                <div class="flex items-center gap-2">
                    <span class="p-2 bg-blue-500/10 rounded-lg text-blue-400 border border-blue-500/20">
                        <i data-lucide="wallet" class="w-6 h-6"></i>
                    </span>
                    <h1 class="text-2xl font-black tracking-tight bg-gradient-to-r from-blue-400 via-indigo-400 to-emerald-400 bg-clip-text text-transparent">
                        TeamMixing Finance
                    </h1>
                </div>
                <p class="text-xs text-slate-400 mt-2 pl-1">Sistem Pemantauan & Transparansi Iuran Bulanan Tim</p>
            </div>
            <!-- Info Nominal Tetap -->
            <div class="flex flex-col sm:items-end gap-1">
                <div class="flex items-center gap-2 bg-slate-900 border border-slate-800 px-3.5 py-1.5 rounded-xl text-xs font-semibold text-slate-300 shadow-sm">
                    <i data-lucide="check-circle" class="w-4 h-4 text-blue-400"></i>
                    <span>Wajib: Rp 30.000 / bulan</span>
                </div>
            </div>
        </header>

        <!-- KARTU UTAMA LAPORAN -->
        <main class="bg-slate-900 border border-slate-800/80 rounded-2xl shadow-2xl overflow-hidden">
            <!-- Filter & Fitur Cari -->
            <div class="p-5 border-b border-slate-800/80 bg-slate-900/50 flex flex-col sm:flex-row justify-between items-center gap-4">
                <h2 class="text-sm font-bold text-slate-300 uppercase tracking-wider flex items-center gap-2">
                    <i data-lucide="layers" class="w-4 h-4 text-blue-400"></i> Rekapitulasi Pembayaran
                </h2>
                <!-- Kolom Pencarian -->
                <div class="relative w-full sm:w-72">
                    <i data-lucide="search" class="absolute left-3 top-2.5 w-4 h-4 text-slate-500"></i>
                    <input type="text" id="searchInput" placeholder="Cari nama anggota..." 
                           class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-9 pr-4 py-2 text-xs text-slate-200 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all placeholder:text-slate-600">
                </div>
            </div>

            <!-- Tabel Data Sesuai Kolom Anda -->
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-950 text-[11px] font-bold uppercase tracking-widest text-slate-400 border-b border-slate-800/60">
                            <th class="px-6 py-4 w-16 text-center">No</th>
                            <th class="px-6 py-4">Nama Anggota</th>
                            <th class="px-6 py-4">Bulan</th>
                            <th class="px-6 py-4">Nominal</th>
                            <th class="px-6 py-4 text-center">Status</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-slate-800/50 text-xs">
                        <!-- Indikator Loading Awal -->
                        <tr>
                            <td colspan="5" class="px-6 py-16 text-center text-slate-500">
                                <div class="flex flex-col items-center justify-center gap-3">
                                    <div
